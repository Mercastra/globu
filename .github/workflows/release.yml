name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, build and test
        run: npm run verify

      - name: Pack the CLIs and pin the plugins to them
        run: npm run pin

      - name: Publish the CLIs
        run: |
          for tarball in ./release/*.tgz; do
            npm publish "$tarball"
          done

      - name: Commit the pins and move the stable branch
        env:
          HUSKY: "0"
        run: |
          version=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins
          git commit -m "Pin plugins to $version"
          git push origin HEAD:main
          git push origin HEAD:stable
